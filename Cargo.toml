[workspace]
resolver = "2"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.local/ort-infer"

[workspace.dependencies]
ortinfer-core = { path = "crates/core" }
ort = { version = "=2.0.0-rc.13" }
tokenizers = { version = "0.22" }
hf-hub = "0.5"
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tracing = "0.1"
base64 = "0.22"

[profile.release]
lto = "thin"
